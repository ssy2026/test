<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Network</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0b0f;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script src="particles.js"></script>
  <script src="interaction.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const ps = new ParticleSystem(canvas, {
      count: 200,
      connectDistance: 120,
      maxConnections: 3,
      speed: 1
    });
    initInteraction(ps);
    ps.start();
  </script>
</body>
</html>
