<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>.</title>
<style>
html,body{margin:0;height:100%;background:#0b0b0f;overflow:hidden}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const g=c.getContext('2d');
let t=0;
function r(){
  c.width=innerWidth;
  c.height=innerHeight;
  t+=0.01;
  g.fillStyle='#0b0b0f';
  g.fillRect(0,0,c.width,c.height);
  g.fillStyle='#e6e6e6';
  for(let i=0;i<160;i++){
    const a=i/160*Math.PI*2+t;
    const d=Math.min(c.width,c.height)*0.28+Math.sin(t*2+i*0.4)*Math.min(c.width,c.height)*0.12;
    g.fillRect(c.width/2+Math.cos(a)*d,c.height/2+Math.sin(a)*d,2,2);
  }
  requestAnimationFrame(r);
}
r();
addEventListener('resize',()=>{c.width=innerWidth;c.height=innerHeight});
</script>
</body>
</html>
